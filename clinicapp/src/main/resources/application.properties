# Puerto del servidor
server.port=8081

# Nombre de la aplicación
spring.application.name=clinicapp-api

# Configuración de la base de datos (MySQL)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/clinicapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=clinic
spring.datasource.password=clinic123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Endpoints de gestión (Actuator)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ====== Configuración JWT para JwtService (usa security.jwt.*) ======
security.jwt.secret=feOTs1JOeYJT7rf4esN+Fq+Fdnqk0kXtpSOJVw1SU/E=
security.jwt.expiration-minutes=30

# ====== Configuración JWT para JwtProperties (usa jwt.*) ======
jwt.secret=feOTs1JOeYJT7rf4esN+Fq+Fdnqk0kXtpSOJVw1SU/E=
jwt.issuer=tdea-clinicapp-auth
