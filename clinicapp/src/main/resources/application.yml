server:
  port: 8081

spring:
  application:
    name: clinicapp-api
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/clinicapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: clinic
    password: clinic
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: "12345678901234567890123456789012_ABCDEF"
  issuer: "tdea-clinicapp-auth"
  ttlSeconds: 3600

logging:
  level:
    org.springframework.security: DEBUG

